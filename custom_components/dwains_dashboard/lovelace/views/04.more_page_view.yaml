# dwains_dashboard

#More_page addon view
# Every user supplied value is emitted with `tojson`: a JSON string is a valid
# YAML scalar, so names such as "Strom: Haus", "Raum #1" or "!secret x" stay
# plain text instead of breaking the dashboard or being evaluated as YAML tags.
{% if _dd_more_pages %}
{% for addon in _dd_more_pages %}
{% set page = _dd_more_pages[addon] %}
- title: {{ page["name"] | string | tojson }}
  path: {{ ("more_page_" ~ (addon|lower|replace("'", "_")|replace(" ", "_"))) | tojson }}
  type: custom:dwains-dashboard-layout
  icon: {{ page["icon"] | string | tojson }}
  visible: true
  cards:
    - type: custom:more-page-card
      name: {{ page["name"] | string | tojson }}
      icon: {{ page["icon"] | string | tojson }}
      show_in_navbar: {{ page["show_in_navbar"] | tojson }}
      foldername: {{ addon | string | tojson }}
      card: !include {{ ("../../../../" ~ page["path"]) | tojson }}
{% endfor %}
{% endif %}
